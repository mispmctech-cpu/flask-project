<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Performance Report – PMC Tech</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Times New Roman', Times, serif; background: #c9c9c9; }

    /* ── Action Bar ───────────────────────────────────────────────── */
    .action-bar {
      background: #6a2c91; color: #fff;
      padding: 10px 24px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0;
      z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .action-bar .bar-left { display: flex; align-items: center; gap: 10px; }
    .action-bar .bar-left img { height: 40px; border-radius: 5px; background:#fff; padding:2px; }
    .action-bar .bar-title { font-size: 1rem; font-weight: 700; }
    .action-bar .bar-right { display: flex; gap: 10px; }
    .btn-bar {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 6px;
      font-size: .84rem; font-weight: 600; border: none; cursor: pointer; transition: .15s;
    }
    .btn-print    { background: #fff; color: #6a2c91; }
    .btn-print:hover { background: #f0e6f8; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }

    /* ── Reports wrapper ──────────────────────────────────────────── */
    .reports-wrapper { padding: 28px 16px 40px; }
    #loadingMsg { text-align: center; padding: 80px 20px; font-size: 1.05rem; color: #374151; }
    .spinner {
      width: 44px; height: 44px; border: 4px solid #d8b4fe;
      border-top-color: #6a2c91; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── A4 Page ──────────────────────────────────────────────────── */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: #fff;
      margin: 0 auto 28px;
      box-shadow: 0 6px 32px rgba(0,0,0,.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      padding: 5mm;
      border: none;
      box-shadow: 0 6px 32px rgba(0,0,0,.25);
      font-family: 'Times New Roman', Times, serif;
    }
    /* Inset border frame: sits exactly 5mm from each page edge */
    .page-border-frame {
      position: absolute;
      top: 5mm; left: 5mm; right: 5mm; bottom: 5mm;
      border: 3px solid #6a2c91;
      pointer-events: none;
      z-index: 999;
    }

    /* ── Report Header ─────────────────────────────────────────────── */
    .rpt-header {
      display: flex; align-items: center;
      padding: 5px 10px 5px 8px;
      border-bottom: 2.5px solid #6a2c91;
      gap: 8px; flex-shrink: 0;
    }
    .rpt-header .logo { height: 70px; width: auto; object-fit: contain; flex-shrink: 0; }
    .college-info { flex: 1; text-align: center; padding: 0 4px; }
    .college-name {
      font-size: .92rem; font-weight: 900; color: #6a2c91;
      letter-spacing: .2px; line-height: 1.25; text-transform: uppercase;
      font-family: 'Times New Roman', Times, serif;
    }
    .college-tag  { font-size: .58rem; color: #374151; line-height: 1.65; margin-top: 2px; font-family: 'Times New Roman', Times, serif; }
    .college-accred { font-size: .58rem; font-weight: 700; color: #501e73; margin-top: 2px; line-height: 1.45; font-family: 'Times New Roman', Times, serif; }
    .college-ugc  { font-size: .55rem; color: #374151; margin-top: 2px; font-family: 'Times New Roman', Times, serif; }

    /* ── Faculty Info ──────────────────────────────────────────────── */
    .fac-info {
      display: flex; gap: 12px; padding: 10px 12px 12px;
      background: #faf7ff; border-bottom: 2.5px solid #6a2c91;
      align-items: flex-start; flex-shrink: 0;
    }
    .fac-photo { width: 80px; height: 96px; object-fit: cover; border: 2.5px solid #6a2c91; flex-shrink: 0; }
    .fac-details { flex: 1; min-width: 0; }
    .fac-name { font-size: 1rem; font-weight: 900; color: #501e73; margin-bottom: 7px; font-family: 'Times New Roman', Times, serif; }
    .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px 7px; }
    .detail-item { background: rgba(255,255,255,.85); border-radius: 3px; padding: 4px 6px; border-left: 2.5px solid #c084fc; }
    .detail-item label { font-size: .55rem; color: #7c3aed; text-transform: uppercase; font-weight: 700; letter-spacing: .3px; display: block; font-family: 'Times New Roman', Times, serif; }
    .detail-item span  { font-size: .7rem; color: #1f2937; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Times New Roman', Times, serif; }

    /* ── Two-column Portfolio Row ──────────────────────────────────── */
    .portfolio-row { display: flex; flex: 1; min-height: 0; border-bottom: 2px solid #6a2c91; }
    .portfolio-col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .portfolio-col.col-dept { border-right: 2px solid #6a2c91; }

    /* ── Academic Year Banner ─────────────────────────────────────── */
    .acad-year-bar {
      text-align: center; padding: 3px 8px; flex-shrink: 0;
      background: #f3e8ff; border-bottom: 2px solid #6a2c91;
      font-family: 'Times New Roman', Times, serif;
      font-size: .72rem; font-weight: 700; color: #501e73;
      letter-spacing: .6px; text-transform: uppercase;
    }

    /* ── Signature Strip ────────────────────────────────────────────── */
    .sig-strip {
      display: flex; border-top: 2.5px solid #6a2c91;
      padding: 15mm 20px 10px; flex-shrink: 0; background: #fff;
    }
    .sig-col { flex: 1; text-align: center; padding: 0 10px; }
    .sig-col:first-child { text-align: left; }
    .sig-col:last-child  { text-align: right; }
    .sig-line {
      height: 32px; margin-bottom: 6px; /* space holder — no visible line */
    }
    .sig-label {
      font-size: .68rem; font-weight: 700; color: #374151;
      text-transform: uppercase; letter-spacing: .6px;
      font-family: 'Times New Roman', Times, serif;
    }

    /* ── Section Header Bars ───────────────────────────────────────── */
    .sec-hdr {
      font-size: .68rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: .7px; padding: 4px 6px; color: #fff;
      text-align: center; flex-shrink: 0;
      font-family: 'Times New Roman', Times, serif;
    }
    .sec-hdr.purple { background: #6a2c91; }
    .sec-hdr.blue   { background: #1d4ed8; }
    .sec-hdr.green  { background: #15803d; }

    /* ── Score Tables (base) ──────────────────────────────────────── */
    .score-wrap { padding: 2px 3px 3px; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
    .score-tbl { width: 100%; border-collapse: collapse; font-size: .41rem; table-layout: fixed; line-height: 1.2; }
    .score-tbl th {
      padding: 3px 2px; text-align: center; font-weight: 700;
      font-size: .41rem; white-space: nowrap; border: 1px solid #9333ea;
      font-family: 'Times New Roman', Times, serif;
    }
    .score-tbl.purple-theme th { background: #f3e8ff; color: #6a2c91; border-color: #7c3aed; }
    .score-tbl.blue-theme   th { background: #dbeafe; color: #1e40af; border-color: #3b82f6; }
    .score-tbl.green-theme  th { background: #dcfce7; color: #15803d; border-color: #16a34a; }
    .score-tbl th:first-child  { width: 15px; text-align: center; }
    .score-tbl th:nth-child(2) { text-align: left; padding-left: 3px; }
    .score-tbl td { padding: 2px 2px; text-align: center; border: 1px solid #c4b5fd; font-size: .41rem; font-family: 'Times New Roman', Times, serif; }
    .score-tbl td:first-child  { color: #9ca3af; font-weight: 700; }
    .score-tbl td:nth-child(2) { text-align: left; padding-left: 3px; color: #374151; font-weight: 500; }
    .score-tbl tbody tr:nth-child(even) td { background: #fafafa; }

    /* ── Vertical tables: months as rows, portfolios as columns ─────── */
    /* Used by Department Portfolio + Faculty Core Scope columns        */
    .score-tbl-v { table-layout: auto; flex: 1; overflow: hidden; }
    .score-tbl-v tbody tr { height: 1%; }
    .score-tbl-v th,
    .score-tbl-v td { font-size: .62rem !important; padding: 3px 4px !important; border: 1px solid #a78bfa !important; }
    /* Month column (first) – wider for full "September 2025" label */
    .score-tbl-v th:first-child {
      width: 88px !important; text-align: left !important; padding-left: 5px !important;
    }
    .score-tbl-v td:first-child {
      width: 88px !important; text-align: left !important; padding-left: 5px !important;
      font-weight: 700 !important; color: #374151 !important;
      background: #f8f5ff !important; white-space: nowrap !important;
    }
    /* Portfolio / scope score columns (2nd+) */
    .score-tbl-v th:nth-child(n+2) {
      text-align: center !important; padding-left: 2px !important;
      white-space: normal !important; word-break: break-word;
      line-height: 1.25; font-size: .58rem !important;
    }
    .score-tbl-v td:nth-child(n+2) {
      text-align: center !important; padding-left: 2px !important;
      color: inherit !important; font-weight: normal !important;
    }

    /* ── Institution table – larger, readable font ──────────────────── */
    .inst-score-wrap .score-tbl th,
    .inst-score-wrap .score-tbl td { font-size: .78rem !important; padding: 3.5px 4px !important; }
    .inst-score-wrap .score-tbl th:nth-child(2),
    .inst-score-wrap .score-tbl td:nth-child(2) { padding-left: 5px !important; }
    .yearly-badge { font-size: .78rem !important; padding: 4px 9px !important; }

    /* ── Institution section ───────────────────────────────────────── */
    .inst-section { border-bottom: 2px solid #6a2c91; flex-shrink: 0; }
    .inst-score-wrap { padding: 2px 4px 3px; }

    /* Yearly badge row */
    .yearly-wrap { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 4px 3px; }
    .yearly-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .42rem; background: #f0fdf4;
      border: .5px solid #bbf7d0; border-radius: 3px; padding: 2px 5px;
    }
    .yr-label { color: #374151; font-weight: 500; }

    /* ── Score color classes ───────────────────────────────────────── */
    .sc-ex { color: #15803d; font-weight: 700; }
    .sc-gd { color: #1d4ed8; font-weight: 600; }
    .sc-av { color: #d97706; font-weight: 600; }
    .sc-pr { color: #dc2626; font-weight: 600; }
    .sc-na { color: #d1d5db; }
    .no-data { text-align: center; color: #9ca3af; font-size: .58rem; padding: 10px 6px; font-style: italic; }

    /* ── Footer ────────────────────────────────────────────────────── */
    .rpt-footer {
      margin-top: auto; background: #f9f6fb; border-top: 2px solid #6a2c91;
      padding: 5px 10px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .auth-text { font-size: .55rem; color: #6b7280; line-height: 1.55; font-family: 'Times New Roman', Times, serif; }
    .auth-title { font-weight: 700; color: #6a2c91; font-size: .62rem; text-transform: uppercase; letter-spacing: .4px; font-family: 'Times New Roman', Times, serif; }
    .zeony-wrap { display: flex; align-items: center; gap: 5px; }
    .zeony-wrap span { font-size: .5rem; color: #9ca3af; }
    img.zeony { height: 24px; object-fit: contain; }

    /* ── Print ──────────────────────────────────────────────────────── */
    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .action-bar { display: none !important; }
      .reports-wrapper { padding: 0 !important; background: #fff !important; }
      .a4-page {
        box-shadow: none !important; margin: 0 !important;
        page-break-after: always; break-after: page;
        width: 210mm !important; height: 297mm !important; overflow: hidden !important;
        padding: 5mm !important; border: none !important;
      }
      .page-border-frame {
        border: 3px solid #6a2c91 !important;
      }
    }
  </style>
</head>
<body>

<script>
  /* ================================================================
     Configuration
  ================================================================ */
  const SUPABASE_URL  = 'https://cbhodgwaazmjszkujrti.supabase.co';
  const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiaG9kZ3dhYXptanN6a3VqcnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU2NzY4NzEsImV4cCI6MjA3MTI1Mjg3MX0.sBRdfiWJJmZtLWsHCcNyxm1VcwkGwZWsIeeMlS49XTU';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const SH_DEPTS = ['S&H V1','S&H V2','S&H V3','S&H V4','S&H V5','S&H V6'];

  // Academic year months Jul–Jun (compact 3-letter labels for two-column layout)
  const MONTHS = [
    { name:'July',      label:'Jul' },
    { name:'August',    label:'Aug' },
    { name:'September', label:'Sep' },
    { name:'October',   label:'Oct' },
    { name:'November',  label:'Nov' },

  const DEPT_FORMS = [

    { label:'Info & Contribution',    table:'form3-monthly', key:'form3' },

  const INST_FORMS = [
    { label:'Dir – Students Welfare & Admission', table:'Institution-form1-monthly',  monthly:true  },
    { label:'Head - HR',                          table:'Institution-form2',           monthly:false },
    { label:'Principal',                          table:'Institution-form3-monthly',   monthly:true  },
    { label:'Dean - IQAC',                        table:'Institution-form4-monthly',   monthly:true  },
    { label:'Director - Academics',               table:'Institution-form5',           monthly:false },
    { label:'Controller of Examinations',         table:'Institution-form6-monthly',   monthly:true  },
    { label:'Exec Dean – International Affairs',  table:'Institution-form7-monthly',   monthly:true  },
    { label:'Head - Placements',                  table:'Institution-form8',           monthly:false },
    { label:'Placement Officer',                  table:'Institution-form9',           monthly:false },
    { label:'Head – Training',                    table:'Institution-form10',          monthly:false },
    { label:'Training Officer',                   table:'Institution-form11',          monthly:false },
    { label:'Head - RISE',                        table:'Institution-form12',          monthly:false },
    { label:'IT Infra – Coordinator',             table:'Institution-form13-monthly',  monthly:true  },
    { label:'Website – Coordinator',             table:'Institution-form14-monthly',  monthly:true  },
    { label:'ERP Coordinator',                    table:'Institution-form15',          monthly:false },
    { label:'Public Relations Officer',           table:'Institution-form16',          monthly:false },
    { label:'Logistics Coordinator',              table:'Institution-form17',          monthly:false },
  ];

  /* ================================================================
     Helpers
  ================================================================ */
  function normName(s) {
    return (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase();
  }
  function matchName(a, b) { return normName(a) === normName(b); }

  /* ---- Flexible column finders (handles inconsistent table schemas) ---- */
  function findNameInRow(r) {
    const known = [
      'Portfolio Member Name','Portfolio Member Name:','Portfolio Memeber Name',
      'faculty_name','Faculty Name','Faculty name','Member Name','Staff Name',
      'Employee Name','Name','name',
    ];
    for (const k of known) { if (r[k] && typeof r[k]==='string' && r[k].trim()) return r[k]; }
    // Fallback: any key whose name contains 'name'
    for (const k of Object.keys(r)) {
      if (/name/i.test(k) && r[k] && typeof r[k]==='string' && r[k].trim()) return r[k];
    }
    return '';
  }
  function findMonthInRow(r) {
    const v = r['Month'] || r['Month:'] || r['month'] || r['MONTH'] || r['month_name']
           || r['MonthName'] || r['Months'] || r['month_year'] || r['period']
           || r['Period'] || r['submission_month'] || r['MonthYear'] || r['Month Year']
           || r['month/year'] || r['Month/Year'] || r['data_month'] || r['Data Month']
           || r['submitted_month'] || r['Submitted Month'] || r['form_month'] || r['Form Month']
           || r['Month_name'] || r['MONTH_NAME'] || r['submission_date'] || '';
    if (v) return v.toString().trim();
    // Fallback: scan every string value in the row for a recognisable month token
    const ALL_MONTHS = ['january','february','march','april','may','june',
                        'july','august','september','october','november','december'];
    for (const val of Object.values(r)) {
      if (!val || typeof val !== 'string') continue;
      const lower = val.toLowerCase().trim();
      for (const mn of ALL_MONTHS) {
        if (lower === mn || lower.startsWith(mn) || lower.includes(mn)) return val;
      }
    }
    return '';
  }
  function findDeptInRow(r) {
    const v = r['Department'] || r['Department:'] || r['Dept'] || r['dept'] || r['department'] || '';
    return (v||'').toString().toLowerCase().trim();
  }
  // Month name → 1-based number map
  const MONTH_NUM_MAP = {
    january:1,february:2,march:3,april:4,may:5,june:6,
    july:7,august:8,september:9,october:10,november:11,december:12,
    jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12
  };
  // Tolerant month match: handles names, abbreviations, ISO dates, numeric months
  function matchMonth(rowMonth, monthName) {
    const raw = (rowMonth||'').toString().trim();
    const mn  = (monthName||'').toLowerCase().trim();
    if (!raw || !mn) return false;
    const rm = raw.toLowerCase().trim();
    const mn3 = mn.substring(0, 3); // first 3 chars (e.g. 'mar')
    // 1. Direct equality
    if (rm === mn) return true;
    // 2. Row value is abbreviation of target (e.g. 'mar' vs 'march')
    if (mn.startsWith(rm) && rm.length >= 3) return true;
    // 3. Row value starts with target abbrev (e.g. 'march 2026' starts with 'mar')
    if (rm.startsWith(mn3)) return true;
    // 4. Row contains full month name anywhere (e.g. 'Academic March 2026')
    if (rm.includes(mn)) return true;
    // 5. Numeric / ISO date match
    const targetNum = MONTH_NUM_MAP[mn];
    if (targetNum) {
      // ISO: '2026-03-01' or '2026-03-01T...' or '2025-03-15'
      const isoM = raw.match(/^\d{4}[\-\/](\d{1,2})/);
      if (isoM && parseInt(isoM[1]) === targetNum) return true;
      // ISO month-first: '03-2026' or '03/2026'
      const isoMF = raw.match(/^(\d{1,2})[\-\/](\d{4})$/);
      if (isoMF && parseInt(isoMF[1]) === targetNum) return true;
      // Plain number '3' or '03'
      if (/^\d{1,2}$/.test(raw) && parseInt(raw) === targetNum) return true;
      // 'MM/YYYY' or 'MM-YYYY' or 'MM YYYY'
      const mmyy = raw.match(/^(\d{1,2})[\s\-\/,]+\d{4}$/);
      if (mmyy && parseInt(mmyy[1]) === targetNum) return true;
      // Month name + year: 'march 2026', 'march-2026', 'mar 2026', 'MARCH-2026'
      const nameYear = rm.match(/^([a-z]+)[\s\-,\/]+(20\d{2}|\d{2})$/);
      if (nameYear) {
        const mnNum = MONTH_NUM_MAP[nameYear[1]] || MONTH_NUM_MAP[nameYear[1].substring(0,3)];
        if (mnNum === targetNum) return true;
      }
      // Fallback: check if the row string contains the 3-letter abbreviation
      if (rm.includes(mn3)) return true;
    }
    return false;
  }

  function calcPct(row, total) {
    if (!row) return null;
    let done = 0;
    for (let i = 1; i <= total; i++) {
      // Support both Status_N (underscore) and Status-N (hyphen) column naming
      const s = (row[`Status_${i}`] || row[`Status-${i}`] || '').toLowerCase();
      if (s === 'completed' || s === 'completed and updated') done++;
    }
    return Math.round((done / total) * 100);
  }
  // Detect what kind of scoring fields exist in a row
  function detectScoreFields(row) {
    // Check for Status_ OR Status- fields (both naming conventions used in DB)
    const statusKeys = Object.keys(row).filter(k => /^Status[_-]\d+$/i.test(k));
    if (statusKeys.length > 0) return { type: 'status', keys: statusKeys, count: statusKeys.length };
    
    // Check for Score/score fields (some forms might use this)
    const scoreKeys = Object.keys(row).filter(k => /^score/i.test(k) && typeof row[k] === 'number');
    if (scoreKeys.length > 0) return { type: 'score', keys: scoreKeys, count: scoreKeys.length };
    
    // Check for numeric fields (last resort)
    const numKeys = Object.keys(row).filter(k => !/id|name|month|dept|date|input/i.test(k) && typeof row[k] === 'number');
    if (numKeys.length > 0) return { type: 'numeric', keys: numKeys, count: numKeys.length };
    
    return { type: 'none', keys: [], count: 0 };
  }

  // Score calculation with dynamic field detection
  function calcPctAdvanced(row) {
    if (!row) return null;
    
    const fields = detectScoreFields(row);
    
    if (fields.type === 'status') {
      // Standard Status_ scoring
      let done = 0;
      for (const k of fields.keys) {
        const s = (row[k]||'').toString().toLowerCase();
        if (s === 'completed' || s === 'completed and updated') done++;
      }
      return fields.count > 0 ? Math.round((done / fields.count) * 100) : null;
    } else if (fields.type === 'score') {
      // Numeric score fields - average them
      const total = fields.keys.reduce((sum, k) => sum + (row[k]||0), 0);
      const avg = total / fields.count;
      return Math.round(avg);
    } else if (fields.type === 'numeric') {
      // Generic numeric fields
      const total = fields.keys.reduce((sum, k) => sum + (row[k]||0), 0);
      const avg = total / fields.count;
      return Math.round(Math.min(100, avg));
    }
    
    return null;
  }

  // Keep old function but improve it — handles both Status_N and Status-N
  function calcPctDynamic(row) {
    if (!row) return null;
    // Match both underscore and hyphen variants: Status_1, Status-1, status_1 etc.
    const keys = Object.keys(row).filter(k => /^Status[_-]\d+$/i.test(k));
    if (!keys.length) {
      return calcPctAdvanced(row);
    }
    let done = 0;
    for (const k of keys) {
      const s = (row[k]||'').toLowerCase();
      if (s === 'completed' || s === 'completed and updated') done++;
    }
    return Math.round((done / keys.length) * 100);
  }

  function scoreSpan(pct) {
    if (pct === null || pct === undefined) return '<span class="sc-na">—</span>';
    const cls = pct >= 80 ? 'sc-ex' : pct >= 60 ? 'sc-gd' : pct >= 40 ? 'sc-av' : 'sc-pr';
    return `<span class="${cls}">${pct}%</span>`;
  }

  /* ================================================================
     Build one A4 faculty report page  (NEW two-column layout)
  ================================================================ */
  function buildPage(fac, coreAll, coreSHAll, deptAll, instAll) {
    const isSH  = SH_DEPTS.includes(fac.department||'');
    const name  = fac['Name'] || '';
    const photo = fac['Upload Image'] || '/static/img/person-circle.svg';
    const dept  = fac['department'] || '—';
    const today = new Date();
    // Academic year: Jul–Dec = academicStartYear, Jan–Jun = academicStartYear+1
    const academicStartYear = today.getMonth() >= 6 ? today.getFullYear() : today.getFullYear() - 1;

    /* ── Core Scope Monthly ── */
    const corePool  = isSH ? coreSHAll : coreAll;
    const coreTotal = 15; // Both Core_scope and Core_scope_SH have Status_1..Status_15
    const coreScores = MONTHS.map(m => {
      // Match by name + month only — department stored as abbreviation (e.g. 'CSE') often
      // differs from Faculty table value, causing false negatives.
      const row = corePool.find(r =>
        matchName(findNameInRow(r), name) &&
        matchMonth(findMonthInRow(r), m.name)
      );
      return calcPct(row, coreTotal);
    });

    /* ── Department Portfolio (only assigned forms) ── */
    const deptRows = [];
    DEPT_FORMS.forEach((f, idx) => {
      if ((fac[f.key]||'').toString().trim().toLowerCase() !== 'yes') return;
      const data = deptAll[idx] || [];
      const scores = MONTHS.map(m => {
        const row = data.find(r => {
          const rDept   = findDeptInRow(r);
          const facDept = (fac.department||'').toLowerCase().trim();
          return matchName(findNameInRow(r), name) &&
                 matchMonth(findMonthInRow(r), m.name) &&
                 (!rDept || !facDept || rDept === facDept);
        });
        return calcPctDynamic(row);
      });
      deptRows.push({ label: f.label, scores });
    });

    /* ── Institution Portfolio (only if faculty has data) ── */
    const instMonthlyRows = [];
    const instYearlyRows  = [];
    INST_FORMS.forEach((f, idx) => {
      const data     = instAll[idx] || [];
      const matching = data.filter(r => matchName(findNameInRow(r), name));
      if (!matching.length) return;
      if (f.monthly) {
        const scores = MONTHS.map(m => {
          const row = matching.find(r => matchMonth(findMonthInRow(r), m.name));
          return calcPctDynamic(row);
        });
        if (scores.some(s => s !== null)) instMonthlyRows.push({ label: f.label, scores });
      } else {
        const row = matching.reduce((best, cur) =>
          ((cur.input_id||0) > (best.input_id||0)) ? cur : best);
        const pct = calcPctDynamic(row);
        if (pct !== null) instYearlyRows.push({ label: f.label, score: pct });
      }
    });

    /* ── Department Portfolio table (VERTICAL: months=rows, portfolios=cols) ── */
    let deptTableHtml;
    if (deptRows.length) {
      // Header: Month | P1 name | P2 name | ...
      const headerCols = '<th>Month</th>' +
        deptRows.map(r => `<th>${r.label}</th>`).join('');
      // Body: one row per month
      const bodyRows = MONTHS.map((m, mi) =>
        `<tr><td>${m.name} ${mi <= 5 ? academicStartYear : academicStartYear + 1}</td>${deptRows.map(r => `<td>${scoreSpan(r.scores[mi])}</td>`).join('')}</tr>`
      ).join('');
      deptTableHtml = `
        <table class="score-tbl score-tbl-v purple-theme">
          <thead><tr>${headerCols}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>`;
    } else {
      deptTableHtml = '<div class="no-data">No department portfolio assigned</div>';
    }

    /* ── Core Scope table (VERTICAL: months=rows) ── */
    const coreTableHtml = `
      <table class="score-tbl score-tbl-v blue-theme">
        <thead><tr><th>Month</th><th>Core Scope</th></tr></thead>
        <tbody>${MONTHS.map((m, mi) =>
          `<tr><td>${m.name} ${mi <= 5 ? academicStartYear : academicStartYear + 1}</td><td>${scoreSpan(coreScores[mi])}</td></tr>`
        ).join('')}</tbody>
      </table>`;

    /* ── Institution Portfolio section ── */
    const monthTHs = MONTHS.map(m => `<th>${m.label}</th>`).join('');
    let instSectionHtml = '';
    if (instMonthlyRows.length || instYearlyRows.length) {
      let instInner = '';
      if (instMonthlyRows.length) {
        const rows = instMonthlyRows.map((r, i) =>
          `<tr><td>${i+1}</td><td>${r.label}</td>${r.scores.map(s=>`<td>${scoreSpan(s)}</td>`).join('')}</tr>`
        ).join('');
        instInner += `
          <table class="score-tbl green-theme">
            <colgroup><col style="width:18px"><col style="width:125px">${MONTHS.map(()=>'<col>').join('')}</colgroup>
            <thead><tr><th>#</th><th>Role / Scope</th>${monthTHs}</tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      }
      if (instYearlyRows.length) {
        const badges = instYearlyRows.map(r => {
          const cls = r.score>=80?'sc-ex':r.score>=60?'sc-gd':r.score>=40?'sc-av':'sc-pr';
          return `<span class="yearly-badge"><span class="yr-label">${r.label}</span><span class="${cls}" style="font-weight:700">${r.score}%</span></span>`;
        }).join('');
        instInner += `<div class="yearly-wrap">${badges}</div>`;
      }
      instSectionHtml = `
        <div class="inst-section">
          <div class="sec-hdr green">Institution Portfolio</div>
          <div class="inst-score-wrap">${instInner}</div>
        </div>`;
    }

    /* ── Assemble A4 page ── */
    return `
    <div class="a4-page">
      <!-- Border frame: 5mm inset from page edge -->
      <div class="page-border-frame"></div>

      <!-- Header: logo + college info -->
      <div class="rpt-header">
        <img class="logo" src="/static/img/pmc.jpg" alt="PMC Logo"
             onerror="this.style.display='none'" />
        <div class="college-info">
          <div class="college-name">Er.Perumal Manimekalai College of Engineering</div>
          <div class="college-tag">An Autonomous Institution &nbsp;&bull;&nbsp; (Approved by AICTE - New Delhi)</div>
          <div class="college-accred">Accredited by NAAC with 'A' Grade &amp; NBA (CSE, ECE, EEE, IT &amp; MECH)</div>
          <div class="college-ugc">Status of 2(f) &amp; 12(b) of the UGC</div>
        </div>
      </div>

      <!-- Faculty Info -->
      <div class="fac-info">
        <img class="fac-photo" src="${photo}" alt="${name}"
             onerror="this.src='/static/img/person-circle.svg'" />
        <div class="fac-details">
          <div class="fac-name">${name}</div>
          <div class="details-grid">
            <div class="detail-item"><label>Employee ID</label><span>${fac['EmployeeID']||'—'}</span></div>
            <div class="detail-item"><label>Department</label><span>${dept}</span></div>
            <div class="detail-item"><label>Designation</label><span>${fac['Designation']||'—'}</span></div>
            <div class="detail-item"><label>Email</label><span style="font-size:.56rem">${fac['email']||'—'}</span></div>
            <div class="detail-item"><label>Mobile</label><span>${fac['Number']||'—'}</span></div>
            <div class="detail-item"><label>Experience</label><span>${fac['Experience']||'—'}</span></div>
            <div class="detail-item" style="grid-column:span 2"><label>Qualification</label><span>${fac['Qualification']||'—'}</span></div>
            <div class="detail-item"><label>Username</label><span>${fac['Username']||'—'}</span></div>
          </div>
        </div>
      </div>

      <!-- Academic Year Banner -->
      <div class="acad-year-bar">Academic Year : ${academicStartYear} &ndash; ${academicStartYear + 1}</div>

      <!-- Two-Column: Department Portfolio | Faculty Core Scope -->
      <div class="portfolio-row">
        <div class="portfolio-col col-dept">
          <div class="sec-hdr purple">Department Portfolio</div>
          <div class="score-wrap">${deptTableHtml}</div>
        </div>
        <div class="portfolio-col">
          <div class="sec-hdr blue">Faculty Core Scope</div>
          <div class="score-wrap">${coreTableHtml}</div>
        </div>
      </div>

      <!-- Institution Portfolio (full width) -->
      ${instSectionHtml}

      <!-- Signature Strip -->
      <div class="sig-strip">
        <div class="sig-col">
          <div class="sig-line"></div>
          <div class="sig-label">Faculty Signature</div>
        </div>
        <div class="sig-col">
          <div class="sig-line"></div>
          <div class="sig-label">HOD Signature</div>
        </div>
        <div class="sig-col">
          <div class="sig-line"></div>
          <div class="sig-label">Principal Signature</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="rpt-footer">
        <div class="auth-text">
          <div class="auth-title">Authorized Report</div>
          <div>Generated by <strong>Zeony Technologies</strong> &nbsp;|&nbsp; ${today.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div>
          <div>PMC Tech &nbsp;&copy;&nbsp; ${today.getFullYear()} &nbsp;All Rights Reserved</div>
        </div>
        <div class="zeony-wrap">
          <span>Powered by</span>
          <img class="zeony" src="/static/img/zeony logo.png" alt="Zeony Technologies"
               onerror="this.style.display='none'" />
        </div>
      </div>

    </div>`;
  }

  /* ================================================================
     Main: load and render
  ================================================================ */
  async function loadReports() {
    const params  = new URLSearchParams(window.location.search);
    const idsStr  = params.get('ids');
    if (!idsStr) {
      document.getElementById('loadingMsg').innerHTML =
        '<div style="color:#dc2626;padding:40px">No faculty IDs specified in the URL.</div>';
      return;
    }
    const ids = idsStr.split(',').map(s => s.trim()).filter(Boolean);
    if (!ids.length) {
      document.getElementById('loadingMsg').innerHTML =
        '<div style="color:#dc2626;padding:40px">No valid IDs found.</div>';
      return;
    }

    try {
      // Parallel fetch: faculty + all portfolio tables
      const [
        { data: facultyList, error: facErr },
        { data: coreAll    },
        { data: coreSHAll  },
        ...deptResults
      ] = await Promise.all([
        sb.from('Faculty').select('*').in('input_id', ids),
        sb.from('Core_scope').select('*'),
        sb.from('Core_scope_SH').select('*'),
        ...DEPT_FORMS.map(f => sb.from(f.table).select('*')),
      ]);

      if (facErr || !facultyList) throw new Error(facErr?.message || 'Failed to load faculty');

      // Fetch institution forms separately (17 tables)
      const instResults = await Promise.all(
        INST_FORMS.map(f => sb.from(f.table).select('*'))
      );
      const instAll = instResults.map(r => r.data || []);
      const deptAll = deptResults.map(r => r.data || []);

      // Render
      const wrapper = document.getElementById('reportsWrapper');
      wrapper.innerHTML = '';

      if (!facultyList.length) {
        wrapper.innerHTML = '<div style="text-align:center;padding:60px;color:#6b7280;">No faculty records found for the given IDs.</div>';
        return;
      }

      for (const fac of facultyList) {
        const html = buildPage(fac, coreAll||[], coreSHAll||[], deptAll, instAll);
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        wrapper.appendChild(tmp.firstElementChild);
      }

    } catch (err) {
      document.getElementById('reportsWrapper').innerHTML =
        `<div style="text-align:center;padding:60px;color:#dc2626;">
          <strong>Error loading reports:</strong><br>${err.message}
        </div>`;
    }
  }

  /* ================================================================
     PDF Download – render each .a4-page individually then combine
  ================================================================ */
  async function downloadPDF() {
    const btn = document.getElementById('downloadBtn');
    btn.innerHTML = '&#8987; Generating PDF…';
    btn.disabled = true;

    try {
      const pages = Array.from(document.querySelectorAll('.a4-page'));
      if (!pages.length) throw new Error('No pages found to export.');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });

      for (let i = 0; i < pages.length; i++) {
        const page = pages[i];
        // Temporarily fix exact pixel size so canvas matches A4 proportions
        const origW = page.style.width, origH = page.style.height, origOF = page.style.overflow;
        page.style.width  = '794px';
        page.style.height = '1123px';
        page.style.overflow = 'hidden';

        const canvas = await html2canvas(page, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          logging: false,
          backgroundColor: '#ffffff',
          width: 794,
          height: 1123,
        });

        // Restore styles
        page.style.width   = origW;
        page.style.height  = origH;
        page.style.overflow = origOF;

        const imgData = canvas.toDataURL('image/jpeg', 0.96);
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, '', 'FAST');
      }

      pdf.save('faculty-performance-report.pdf');
    } catch (e) {
      alert('PDF generation failed. Please use Print instead.\n' + e.message);
    }

    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Download PDF`;
    btn.disabled = false;
  }

  // Start
  loadReports();
</script>
</body>
